
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="LIFE OS personal university and life organizer">
<link rel="manifest" href="./manifest.webmanifest">
<title>LIFE OS</title>

<style>

:root {
  --bg: #101014;
  --sidebar: #0c0d10;
  --panel: #18191f;
  --panel2: #202129;
  --line: #2b2c35;
  --text: #ededf2;
  --muted: #92939f;
  --purple: #8b72e9;
  --purple-hover: #a18cf5;
  --green: #4cc9a6;
  --amber: #f2bd66;
  --red: #ef8585;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 Inter, system-ui, -apple-system, sans-serif;
}

button, input, select, textarea { font: inherit; }

button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #22232b;
  color: var(--text);
  padding: 9px 13px;
  border-radius: 7px;
  transition: .18s ease;
}

button:hover {
  background: #30313c;
  border-color: #484957;
}

button.primary {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
  font-weight: 600;
}

button.primary:hover {
  background: var(--purple-hover);
}

button.danger {
  color: var(--red);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

/* Top toolbar */

header.topbar {
  height: 58px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 23px;
  background: #111216;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-left, .top-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.brandmark {
  font-weight: 800;
  letter-spacing: .13em;
  font-size: 15px;
}

.brandmark span { color: var(--purple); }

.crumb {
  color: var(--muted);
  font-size: 13px;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}

#today, .status {
  color: var(--muted);
  font-size: 12px;
}
/* Compact icon sidebar */

.app-shell {
  grid-template-columns: 76px minmax(0, 1fr);
}

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  padding: 18px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.workspace-switch {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  background: #17181e;
  border-radius: 10px;
  margin-bottom: 25px;
  font-size: 21px;
}

.workspace-switch small,
.workspace-switch strong,
.nav-label,
.sidebar-bottom {
  display: none;
}

nav {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  width: 100%;
}

#nav button {
  position: relative;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #a4a5b0;
  font-size: 22px;
  text-align: center;
}

#nav button:hover {
  background: #1b1c23;
  color: var(--text);
}

#nav button.active {
  background: #272332;
  border-color: #393149;
  color: #c5b6ff;
}

/* Hover tooltip */

#nav button::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 59px;
  top: 50%;
  transform: translateY(-50%);
  background: #292832;
  color: white;
  border: 1px solid #454451;
  border-radius: 6px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 50;
  box-shadow: 0 5px 18px #0008;
}

#nav button:hover::after,
#nav button:focus-visible::after {
  opacity: 1;
  visibility: visible;
}

.content-area {
  min-width: 0;
  padding: 30px 36px;
}


main {
  max-width: 1150px;
  width: 100%;
  margin: 0 auto;
}

/* Headings */

h1 {
  font-size: 25px;
  letter-spacing: -.7px;
  margin: 0 0 5px;
  font-weight: 650;
}

h2 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 15px;
}

.muted, .sub { color: var(--muted); }

.sub {
  margin-bottom: 25px;
  font-size: 13px;
}

/* Panels and dashboard cards */

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.stats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 22px 0;
  gap: 12px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 19px;
  margin-bottom: 15px;
}

.stat {
  min-height: 105px;
}

.stat strong {
  display: block;
  font-size: 29px;
  font-weight: 650;
  letter-spacing: -1px;
  color: white;
}

.stat span {
  color: var(--muted);
  font-size: 12px;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.stack {
  display: grid;
  gap: 10px;
}

.item {
  padding: 12px 13px;
  background: #202129;
  border: 1px solid #30313b;
  border-radius: 7px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 8px;
}

.item p {
  margin: 3px 0;
  color: var(--muted);
  font-size: 12px;
}

.tag {
  display: inline-block;
  border-radius: 5px;
  padding: 3px 8px;
  background: #302b40;
  color: #c8baff;
  font-size: 11px;
}

.tag.high {
  background: #462a32;
  color: #ffb7c0;
}

.tag.medium {
  background: #453927;
  color: #f5d28d;
}

.empty {
  padding: 30px 15px;
  text-align: center;
  color: var(--muted);
  background: #15161c;
  border: 1px dashed #353641;
  border-radius: 7px;
}

/* Forms */
/* Create forms and list spacing */

.create-form-card {
  margin-top: 22px;
  margin-bottom: 28px;
}

#create {
  margin-top: 8px;
}
form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}

label.full { grid-column: 1 / -1; }

input, select, textarea {
  width: 100%;
  padding: 10px 11px;
  background: #111218;
  border: 1px solid #343540;
  border-radius: 6px;
  color: var(--text);
}

input:focus, select:focus, textarea:focus {
  border-color: var(--purple);
}

textarea { min-height: 85px; }

form .actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
}

/* Timetable */

.days {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 17px 0;
}

.days button {
  min-width: 48px;
  background: #202129;
}

.days button.selected {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
}

.timeline { display: grid; gap: 9px; }

.timeline .item {
  border-left: 3px solid var(--purple);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th, td {
  text-align: left;
  padding: 11px 9px;
  border-bottom: 1px solid var(--line);
}

th {
  color: var(--muted);
  font-weight: 500;
}

/* Authentication */

.auth-wrap {
  max-width: 440px;
  margin: 9vh auto;
  padding: 0 18px;
}

.auth-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 28px;
}

.auth-card form { grid-template-columns: 1fr; }
.auth-card label.full, .auth-card form .actions { grid-column: auto; }

.notice {
  padding: 11px 13px;
  border-radius: 7px;
  background: #29243a;
  color: #d2c8ff;
  margin: 12px 0;
}

.error { color: #ffaaaa; }

/* Mobile navigation */

.navmobile { display: none; }

@media(max-width: 850px) {
  .app-shell { grid-template-columns: 190px minmax(0, 1fr); }
  .content-area { padding: 23px 18px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 650px) {
  header.topbar { padding: 0 13px; }
  .crumb { display: none; }
  .topbar-left, .top-actions { gap: 9px; }
  .app-shell { display: block; }
  .sidebar { display: none; }
  .content-area { padding: 15px 12px; }
  .navmobile {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding: 9px 10px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--line);
  }
  .navmobile button {
    white-space: nowrap;
    padding: 7px 10px;
    font-size: 12px;
  }
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
  #today { display: none; }
}

@media(max-width: 440px) {
  form { grid-template-columns: 1fr; }
  label.full, form .actions { grid-column: auto; }
  .card { padding: 14px; }
  .stats { gap: 8px; }
  .stat { min-height: 90px; }
}


/* Fix sidebar positioning */
@media (min-width: 651px) {
  .app-shell {
    display: grid !important;
    grid-template-columns: 76px minmax(0, 1fr) !important;
    width: 100%;
    align-items: stretch;
  }

  .sidebar {
    display: flex !important;
    grid-column: 1;
    grid-row: 1;
    width: 76px;
    min-width: 76px;
    align-self: stretch;
    justify-self: start;
  }

  .content-area {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
    width: 100%;
  }
}
@media (min-width: 651px) {
  .app-shell {
    min-height: calc(100vh - 58px);
    align-items: stretch;
  }

  .sidebar {
    min-height: calc(100vh - 58px);
    height: 100%;
    align-self: stretch;
    border-right: 1px solid var(--line);
  }
}

/* Edit and delete controls */
.item-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

button.edit-button {
  color: #c5b6ff;
  background: #272332;
  border-color: #393149;
}

button.edit-button:hover {
  background: #393149;
}

.edit-form-card {
  margin: 12px 0 25px;
  border-color: var(--purple);
}

.edit-form-card h2 {
  margin-bottom: 14px;
}

.class-editor-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #202129;
  border: 1px solid var(--line);
  border-radius: 7px;
  margin-bottom: 8px;
}

@media(max-width: 440px) {
  .class-editor-row {
    align-items: flex-start;
    flex-direction: column;
  }
}

</style>
</head>

["Monday","12:30","14:30","SD2 – Sistemas Digitais (PB) ","V1.32","1,3,7,10,12,14"],

["Monday","15:30","16:30","CDI11 – Cálculo Diferencial e Integral I (PB) ","V1.25","1-4,6-7,9-15"],
["Monday","17:30","19:00","CDI11 – Cálculo Diferencial e Integral I (TP)","PA2","1-4,6-7,9-15"],
["Tuesday","11:30","12:30","CDI11 – Cálculo Diferencial e Integral I (TP)","PA2","1-7,9-12,15"],
["Tuesday","13:30","15:30","QG3 – Química Geral (Lab)","LQG Lab. Química Geral","1,3,5,7,10,12"],
["Tuesday","15:30","17:30","IEECom – Introdução à Engenharia Eletrotécnica e de Computadores","LE1","1-7"],
["Wednesday","11:30","13:30","IEECom – Introdução à Engenharia Eletrotécnica e de Computadores","LE1","1-7"],
["Wednesday","13:30","15:00","AL6 – Álgebra Linear (TP)","GA4","1-7,9-15"],
["Wednesday","15:00","16:00","QG3 – Química Geral (T)","QA02.2","1-7,9-15"],
["Thursday","12:30","14:30","SD2 – Sistemas Digitais (Lab)","SD1","2,4,6,9,11,13,15"],
["Thursday","15:30","17:00","AL6 – Álgebra Linear (TP)","GA4","1-6,9,15"],
["Thursday","18:00","19:00","QG3 – Química Geral (T)","QA02.2","1-6,9-15"],
["Friday","15:00","16:00","QG3 – Química Geral (PB) ","V1.32","1-6,9,15"],
["Friday","17:00","19:00","SD2 – Sistemas Digitais (T)","GA4","1-6,9,15"]

function getSchedule(){
  return Array.isArray(data.weeklyTimetable)
    ? data.weeklyTimetable

function classEditForm(index=null){
  const existing=index===null
    ? ["Monday","09:00","10:00","","","Every week"]
    : getSchedule()[index];

  return `

          <select name="day">

function wireClassForm(){
  const form=document.querySelector("#classForm");
  if(!form)return;

  form.onsubmit=e=>{
    e.preventDefault();

    const o=Object.fromEntries(new FormData(form));
    const index=o.index;

    const entry=[
      o.day,
      o.start,
      o.end,
      o.subject,
      o.room,
      o.weeks
    ];

    const updated=getSchedule().map(x=>[...x]);

    if(index===""){
      updated.push(entry);
    }else{
      updated[Number(index)]=entry;
    }

    data.weeklyTimetable=updated;
    save();
    render();
  };

  document.querySelector("#cancelClass").onclick=()=>{
    render();
  };
}

const defaultData={
  tasks:[],
  exams:[],
  events:[],
  weeklyTimetable:null
};

let data=loadLocal();
let page="Home";
let week=academicWeek(new Date());
let day="Monday";
let currentUser=null;
let savingTimer=null;

function loadLocal(){
  try{
    return {...defaultData,...JSON.parse(localStorage.getItem("lifeos")||"{}")};
  }catch{
    return structuredClone(defaultData);
  }
}

function saveLocal(){
  localStorage.setItem("lifeos",JSON.stringify(data));
}

function uuid(){
  return crypto.randomUUID
    ? crypto.randomUUID()
    : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
}

function normalizeIds(){
  for(const k of ["tasks","exams","events"]){
    data[k]=data[k].map(x=>({...x,id:String(x.id||uuid())}));
  }
}

function academicWeek(d){
  let start=new Date(2026,8,7);
  let m=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.floor((m-start)/604800000)+1;
}
function getLocalDate(dateString){
  if(!dateString)return null;

  const [year,month,day]=dateString.split("-").map(Number);
  return new Date(year,month-1,day);
}

function getDatedItemsForDay(selectedDay,selectedWeek){
  const items=[];

  for(const event of data.events){
    const date=getLocalDate(event.date);

    if(date && DAYS[date.getDay()===0?6:date.getDay()-1]===selectedDay
       && academicWeek(date)===selectedWeek){
      items.push({
        title:event.title,
        type:"Event",
        start:event.start||"00:00",
        end:event.end||"",
        room:"",
        notes:event.notes||""
      });
    }
  }

  for(const exam of data.exams){
    const date=getLocalDate(exam.date);

    if(date && DAYS[date.getDay()===0?6:date.getDay()-1]===selectedDay
       && academicWeek(date)===selectedWeek){
      items.push({
        title:exam.title,
        type:"Exam",
        start:"00:00",
        end:"",
        room:exam.subject||"",
        notes:exam.topics||""
      });
    }
  }

  return items;
}
  
function weeksMatch(rule,w){
  if(rule==="Every week")return true;
  return rule.split(",").some(part=>{
    let [a,b]=part.split("-").map(Number);
    return b?w>=a&&w<=b:w===a;
  });
}

function esc(s=""){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

const navItems=["Home","Timetable","Study planner","Tests & exams","Calendar","Events","Settings"];

function setStatus(s){

}

}

async function authSubmit(e){
  e.preventDefault();

  const f=new FormData(e.target);
  const email=f.get("email");
  const password=f.get("password");
  const mode=e.submitter?.value||"login";

  setStatus("Authenticating…");

  let result=mode==="signup"
    ? await supabaseClient.auth.signUp({
  email,
  password,
  options: {
    emailRedirectTo: "https://joaoferreira17022008-cell.github.io/life-os/"
  }
})
    : await supabaseClient.auth.signInWithPassword({email,password});

  if(result.error){
    showAuth(result.error.message,true);
    return;
  }

  if(mode==="signup"&&!result.data.session){
    showAuth("Account created. Check your email for a confirmation link, then return here and log in.");
    return;
  }

  if(result.data.session){
    await startSession(result.data.session);
  }
}

async function startSession(session){
  currentUser=session.user;

  document.querySelector("#auth").hidden=true;
  document.querySelector("#workspace").hidden=false;
  document.querySelector("#logout").hidden=false;
  document.querySelector("#export").hidden=false;

  setStatus("Loading cloud data…");

  await loadCloudData();
  render();

  if(currentUser){
    setStatus("Synced · "+currentUser.email);
  }
}

async function loadCloudData(){
  const {data:row,error}=await supabaseClient
    .from("lifeos_data")
    .select("data")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    setStatus("Cloud error");
    alert("Could not load cloud data: "+error.message);
    return;
  }

  if(row?.data){
    data={...defaultData,...row.data};
    normalizeIds();
    saveLocal();
  }else{
    normalizeIds();
    saveLocal();
    await pushCloudData();
  }
}

async function pushCloudData(){
  if(!currentUser)return;

  setStatus("Saving…");

  const {error}=await supabaseClient
    .from("lifeos_data")
    .upsert({
      user_id:currentUser.id,
      data,
      updated_at:new Date().toISOString()
    },{onConflict:"user_id"});

  if(error){
    setStatus("Sync error");
    console.error(error);
    return;
  }

  setStatus("Synced · "+new Date().toLocaleTimeString());
}

function save(){
  normalizeIds();
  saveLocal();

  if(currentUser){
    clearTimeout(savingTimer);
    savingTimer=setTimeout(pushCloudData,350);
  }
}

function wireEditForm(){
  document.querySelectorAll(".edit-item-form").forEach(form=>{
    form.onsubmit=e=>{
      e.preventDefault();

      const o=Object.fromEntries(new FormData(form));
      const kind=o.kind;
      const id=o.id;

      delete o.kind;
      delete o.id;

      const item=data[kind].find(x=>x.id===id);

      if(item){
        Object.assign(item,o);
        save();
        render();
      }
    };

    form.querySelector(".cancel-edit").onclick=()=>{
      render();
    };
  });
}

function wireForm(){
  document.querySelector("#cancel").onclick=render;

  document.querySelector("#create").onsubmit=e=>{
    e.preventDefault();

    let o=Object.fromEntries(new FormData(e.target));
    let kind=o.kind.toLowerCase()+"s";

    delete o.kind;
    o.id=uuid();

    if(kind==="studys")kind="tasks";
    if(!data[kind])return;

    if(kind==="tasks")o.done=false;

    data[kind].push(o);
    save();
    render();
  };
}

function exportData(){
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="life-os-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(e){
  let f=e.target.files[0];
  if(!f)return;

  let r=new FileReader();

  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(!x.tasks||!x.exams||!x.events)throw Error();

      data=x;
      normalizeIds();
      save();
      render();
      alert("Backup imported and queued for cloud sync.");
    }catch{
      alert("That backup file is invalid.");
    }
  };

  r.readAsText(f);
}

document.querySelector("#export").onclick=exportData;

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();

  if(session){
    await startSession(session);
  }else{
    showAuth();
    setStatus("Not signed in");
  }

  supabaseClient.auth.onAuthStateChange((_event,session)=>{
    if(session&&!currentUser){
      startSession(session);
    }else if(!session&&currentUser){
      currentUser=null;
      showAuth("You have been signed out.");
    }
  });
})();

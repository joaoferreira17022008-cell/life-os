<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="LIFE OS personal university and life organizer">
<link rel="manifest" href="./manifest.webmanifest">
<title>LIFE OS</title>
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--line:#263750;--text:#eef4ff;--muted:#9aabc4;--blue:#65a7ff;--green:#4bd1a0;--amber:#f6c66b;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#20314b;color:var(--text);padding:9px 13px;border-radius:10px}button.primary{background:#2466bd;border-color:#2466bd}button.danger{color:#ffaaaa}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1220ed;z-index:5}.brand{font-weight:850;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-weight:400;letter-spacing:0}
.layout{display:grid;grid-template-columns:220px 1fr;max-width:1400px;margin:auto;min-height:calc(100vh - 72px)}nav{padding:20px 14px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border-color:transparent;color:var(--muted)}nav button.active{background:var(--panel2);color:var(--text);border-color:var(--line)}main{padding:26px;max-width:1100px;width:100%;margin:auto}.navmobile{display:none}
h1{font-size:27px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.sub{margin-bottom:22px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stack{display:grid;gap:10px}.item{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.item p{margin:3px 0;color:var(--muted);font-size:13px}.tag{display:inline-block;border-radius:20px;padding:2px 9px;background:#263d5c;color:#b9d8ff;font-size:12px}.tag.high{background:#522d35;color:#ffc0c0}.tag.medium{background:#51432b;color:#ffe0a1}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;color:var(--muted);font-size:13px}label.full{grid-column:1/-1}input,select,textarea{width:100%;padding:10px;background:#0b1525;border:1px solid var(--line);border-radius:9px;color:var(--text)}textarea{min-height:75px}form .actions{grid-column:1/-1;display:flex;gap:8px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.days button.selected{background:#2466bd;border-color:#2466bd}.timeline{display:grid;gap:9px}.timeline .item{border-left:4px solid var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.empty{padding:25px;text-align:center;color:var(--muted);background:var(--panel);border-radius:12px}
.auth-wrap{max-width:460px;margin:7vh auto;padding:0 18px}.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.auth-card form{grid-template-columns:1fr}.auth-card label.full,.auth-card form .actions{grid-column:auto}.notice{padding:11px 13px;border-radius:10px;background:#172b42;color:#cfe2ff;margin:12px 0}.error{color:#ffaaaa}.status{font-size:12px;color:var(--muted)}
@media(max-width:800px){.layout{display:block}nav{display:none}main{padding:17px}.navmobile{display:flex;gap:5px;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}.navmobile button{white-space:nowrap;padding:8px 10px}.stats{grid-template-columns:repeat(2,1fr)}header{padding:14px 16px}.grid{grid-template-columns:1fr}}
@media(max-width:440px){form{grid-template-columns:1fr}label.full,form .actions{grid-column:auto}.stats{gap:8px}.card{padding:13px}}
</style>
</head>
<body>
<header><div class="brand">LIFE OS<small>Your personal command centre</small></div><div class="row"><span class="muted" id="today"></span><span class="status" id="cloudStatus">Connecting…</span><button id="export" hidden>Export backup</button><button id="logout" hidden>Log out</button></div></header>
<div id="auth" class="auth-wrap" hidden></div>
<div id="workspace" hidden><div class="navmobile" id="mobileNav"></div><div class="layout"><nav id="nav"></nav><main id="app" aria-live="polite"></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* LIFE OS Supabase configuration */
const SUPABASE_URL = "https://ehqtqkpgawiwnvcbqyqe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4sjEIh5OY_PokLfbfupt_w_cJqhenyY";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const subjects=["CDI11 – Cálculo Diferencial e Integral I","QG3 – Química Geral","AL6 – Álgebra Linear","SD2 – Sistemas Digitais","IEECom – Introdução à Engenharia Eletrotécnica e de Computadores","Comunicação e Ciência"];
const schedule=[
["Monday","09:00","12:00","Comunicação e Ciência","","Every week"],
["Monday","12:30","14:30","SD2 – Sistemas Digitais","V1.32","1,3,7,10,12,14"],
["Monday","14:30","15:30","AL6 – Álgebra Linear","V1.25","1-4,6-7,9-15"],
["Monday","15:30","16:30","CDI11 – Cálculo Diferencial e Integral I","V1.25","1-4,6-7,9-15"],
["Monday","17:30","19:00","CDI11 – Cálculo Diferencial e Integral I (TP)","PA2","1-4,6-7,9-15"],
["Tuesday","11:30","12:30","CDI11 – Cálculo Diferencial e Integral I (TP)","PA2","1-7,9-12,15"],
["Tuesday","13:30","15:30","QG3 – Química Geral (Lab)","LQG Lab. Química Geral","1,3,5,7,10,12"],
["Tuesday","15:30","17:30","IEECom – Introdução à Engenharia Eletrotécnica e de Computadores","LE1","1-7"],
["Wednesday","11:30","13:30","IEECom – Introdução à Engenharia Eletrotécnica e de Computadores","LE1","1-7"],
["Wednesday","13:30","15:00","AL6 – Álgebra Linear (TP)","GA4","1-7,9-15"],
["Wednesday","15:00","16:00","QG3 – Química Geral (T)","QA02.2","1-7,9-15"],
["Thursday","12:30","14:30","SD2 – Sistemas Digitais (Lab)","SD1","2,4,6,9,11,13,15"],
["Thursday","15:30","17:00","AL6 – Álgebra Linear (TP)","GA4","1-6,9,15"],
["Thursday","18:00","19:00","QG3 – Química Geral (T)","QA02.2","1-6,9-15"],
["Friday","15:00","16:00","QG3 – Química Geral","V1.32","1-6,9,15"],
["Friday","17:00","19:00","SD2 – Sistemas Digitais","GA4","1-6,9,15"]
];
const defaultData={tasks:[],exams:[],events:[]};
let data=loadLocal(),page="Home",week=academicWeek(new Date()),day="Monday",currentUser=null,savingTimer=null;
function loadLocal(){try{return {...defaultData,...JSON.parse(localStorage.getItem("lifeos")||"{}")}}catch{return structuredClone(defaultData)}}
function saveLocal(){localStorage.setItem("lifeos",JSON.stringify(data))}
function uuid(){return crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
function normalizeIds(){for(const k of ["tasks","exams","events"])data[k]=data[k].map(x=>({...x,id:String(x.id||uuid())}))}
function academicWeek(d){let start=new Date(2026,8,7),m=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.floor((m-start)/604800000)+1}
function weeksMatch(rule,w){if(rule==="Every week")return true;return rule.split(",").some(part=>{let [a,b]=part.split("-").map(Number);return b?w>=a&&w<=b:w===a})}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const navItems=["Home","Timetable","Study planner","Tests & exams","Calendar","Events","Settings"];
function setStatus(s){document.querySelector("#cloudStatus").textContent=s}
function showAuth(message="",isError=false){document.querySelector("#workspace").hidden=true;document.querySelector("#auth").hidden=false;document.querySelector("#logout").hidden=true;document.querySelector("#export").hidden=true;document.querySelector("#auth").innerHTML=`<section class="auth-card"><h1>Welcome to LIFE OS</h1><p class="muted">Sign in to access your personal timetable, study tasks, exams and events from any device.</p>${message?`<div class="notice ${isError?'error':''}">${esc(message)}</div>`:""}<form id="authForm"><label class="full">Email<input name="email" type="email" autocomplete="email" required></label><label class="full">Password<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="actions"><button class="primary" name="mode" value="login">Log in</button><button name="mode" value="signup">Create account</button></div></form><p class="muted">Use the same account on your other devices to sync your data.</p></section>`;document.querySelector("#authForm").onsubmit=authSubmit}
async function authSubmit(e){e.preventDefault();const f=new FormData(e.target),email=f.get("email"),password=f.get("password"),mode=e.submitter?.value||"login";setStatus("Authenticating…");let result=mode==="signup"?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(result.error){showAuth(result.error.message,true);return}if(mode==="signup"&&!result.data.session){showAuth("Account created. Check your email for a confirmation link, then return here and log in.");return}if(result.data.session)await startSession(result.data.session)}
async function startSession(session){currentUser=session.user;document.querySelector("#auth").hidden=true;document.querySelector("#workspace").hidden=false;document.querySelector("#logout").hidden=false;document.querySelector("#export").hidden=false;setStatus("Loading cloud data…");await loadCloudData();render();setStatus("Synced · "+currentUser.email)}
async function loadCloudData(){const {data:row,error}=await supabase.from("lifeos_data").select("data").eq("user_id",currentUser.id).maybeSingle();if(error){setStatus("Cloud error");alert("Could not load cloud data: "+error.message);return}if(row?.data){data={...defaultData,...row.data};normalizeIds();saveLocal()}else{normalizeIds();saveLocal();await pushCloudData()}}
async function pushCloudData(){if(!currentUser)return;setStatus("Saving…");const {error}=await supabase.from("lifeos_data").upsert({user_id:currentUser.id,data,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){setStatus("Sync error");console.error(error);return}setStatus("Synced · "+new Date().toLocaleTimeString() )}
function save(){normalizeIds();saveLocal();if(currentUser){clearTimeout(savingTimer);savingTimer=setTimeout(pushCloudData,350)}}
function go(p){page=p;render()}
function nav(){let html=navItems.map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join("");document.querySelector("#nav").innerHTML=html;document.querySelector("#mobileNav").innerHTML=html;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function addForm(kind){let fields=kind==="Study"?`<label>Subject<select name="subject">${subjects.map(s=>`<option>${s}</option>`)}</select></label><label>Date<input name="date" type="date"></label><label>Preferred day<select name="day"><option value="">Unscheduled</option>${DAYS.map(d=>`<option>${d}</option>`)}</select></label><label>Duration (minutes)<input name="duration" type="number" value="60"></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label>`:kind==="Exam"?`<label>Subject<select name="subject">${subjects.map(s=>`<option>${s}</option>`)}</select></label><label>Date<input name="date" type="date" required></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><label class="full">Topics to revise<textarea name="topics"></textarea></label>`:`<label>Date<input name="date" type="date" required></label><label>Start<input name="start" type="time"></label><label>End<input name="end" type="time"></label>`;
return `<section class="card"><h2>Add ${kind}</h2><form id="create"><input type="hidden" name="kind" value="${kind}"><label class="full">Title<input name="title" required placeholder="Enter a title"></label>${fields}<label class="full">Notes<textarea name="notes"></textarea></label><div class="actions"><button class="primary">Save ${kind}</button><button type="button" id="cancel">Cancel</button></div></form></section>`}
function remove(kind,id){if(!confirm("Delete this item?"))return;data[kind]=data[kind].filter(x=>x.id!==id);save();render()}
function listItem(x,kind){return `<div class="item"><div><strong>${esc(x.title)}</strong><p>${esc(x.subject||x.date||x.day||"")}${x.start?" · "+x.start:""}${x.room?" · "+esc(x.room):""}</p>${x.notes?`<p>${esc(x.notes)}</p>`:""}${x.topics?`<p>Topics: ${esc(x.topics)}</p>`:""}</div><div>${x.priority?`<span class="tag ${x.priority.toLowerCase()}">${x.priority}</span>`:""}<button class="danger" data-del="${kind}:${x.id}" aria-label="Delete ${esc(x.title)}">×</button></div></div>`}
function render(){
nav();let html="";
if(page==="Home"){html=`<h1>Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"}.</h1><div class="sub">Here's what's happening in your LIFE OS.</div><div class="grid stats"><div class="card stat"><strong>${data.tasks.filter(t=>!t.done).length}</strong><span>Pending study tasks</span></div><div class="card stat"><strong>${data.exams.length}</strong><span>Exams & tests</span></div><div class="card stat"><strong>${data.events.length}</strong><span>Personal events</span></div><div class="card stat"><strong>${data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0}%</strong><span>Study completion</span></div></div><div class="grid"><section class="card"><h2>Upcoming exams</h2>${data.exams.length?data.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>listItem(x,"exams")).join(""):'<div class="empty">No exams added yet.</div>'}</section><section class="card"><h2>Study priorities</h2>${data.tasks.filter(t=>!t.done).slice(0,6).map(t=>`<div class="item"><label><span><input type="checkbox" data-task="${t.id}" ${t.done?"checked":""}> ${esc(t.title)}</span><p>${esc(t.subject||"General")} · ${t.date||t.day||"Unscheduled"}</p></label></div>`).join("")||'<div class="empty">No pending study tasks.</div>'}</section></div>`}
if(page==="Timetable"){let sessions=schedule.filter(x=>x[0]===day&&weeksMatch(x[5],week));html=`<h1>Weekly timetable</h1><div class="sub">Semester 1 · Week 1 began 7 September 2026. Current academic week: ${week}.</div><section class="card"><div class="row"><button id="prev">← Previous week</button><strong>Week ${week}</strong><button id="next">Next week →</button></div><div class="days">${DAYS.map(d=>`<button data-day="${d}" class="${day===d?'selected':''}">${d.slice(0,3)}</button>`).join("")}</div><h2>${day}</h2>${sessions.length?sessions.map(x=>`<div class="item"><div><strong>${x[3]}</strong><p>${x[1]}–${x[2]} · ${x[4]||"Room not specified"}</p></div><span class="tag">Class</span></div>`).join(""):'<div class="empty">No classes scheduled.</div>'}</section><section class="card"><h2>Weekly class list</h2><p class="muted">Classes automatically appear only in their specified semester weeks.</p><table><tr><th>Day</th><th>Time</th><th>Class</th><th>Room</th></tr>${schedule.filter(x=>weeksMatch(x[5],week)).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}–${x[2]}</td><td>${x[3]}</td><td>${x[4]||"—"}</td></tr>`).join("")}</table></section>`}
if(page==="Study planner"){html=`<h1>Study planner</h1><div class="sub">Track revision, topics and tasks.</div><button class="primary" data-add="Study">＋ Add study task</button><section class="card"><h2>My study tasks</h2>${data.tasks.length?data.tasks.map(t=>`<div class="item"><label><span><input type="checkbox" data-task="${t.id}" ${t.done?"checked":""}> ${esc(t.title)}</span><p>${esc(t.subject||"")} · ${t.day||t.date||"Unscheduled"} · ${t.duration||60} min</p></label><button class="danger" data-del="tasks:${t.id}">×</button></div>`).join(""):'<div class="empty">Add your first study task.</div>'}</section><section class="card"><h2>Automatic study suggestions</h2><p class="muted">This first version can assign unscheduled tasks to open weekday afternoon slots. Review suggestions before relying on them.</p><button id="autoplan">Suggest study slots</button><div id="suggestions"></div></section>`}
if(page==="Tests & exams"){html=`<h1>Tests & exams</h1><div class="sub">Dates, subjects, revision topics and priorities.</div><button class="primary" data-add="Exam">＋ Add exam</button><section class="card">${data.exams.length?data.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>listItem(x,"exams")).join(""):'<div class="empty">No exams registered.</div>'}</section>`}
if(page==="Calendar"||page==="Events"){html=`<h1>${page}</h1><div class="sub">Manage appointments, deadlines and personal plans.</div><button class="primary" data-add="Event">＋ Add event</button><section class="card">${data.events.length?data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>listItem(x,"events")).join(""):'<div class="empty">No events added yet.</div>'}</section><section class="card"><h2>Exam dates</h2>${data.exams.map(x=>listItem(x,"exams")).join("")||'<p class="muted">No exams yet.</p>'}</section>`}
if(page==="Settings"){html=`<h1>Settings & data</h1><div class="sub">Your data is stored in your Supabase account and cached in this browser.</div><section class="card"><h2>Backup and restore</h2><p class="muted">Export a JSON backup regularly. Import it on another device to transfer your data.</p><button id="export2">Download backup</button><label class="full">Import backup<input type="file" id="import" accept="application/json"></label></section><section class="card"><h2>Cloud account</h2><p class="muted">Signed in as ${esc(currentUser?.email||"")}. Your personal data is protected by database row-level security.</p><button class="danger" id="clear">Delete all LIFE OS data</button></section>`}
document.querySelector("#app").innerHTML=html;
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{document.querySelector("#app").insertAdjacentHTML("afterbegin",addForm(b.dataset.add));wireForm()});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.del.split(":");remove(k,id)});
document.querySelectorAll("[data-task]").forEach(b=>b.onchange=()=>{let t=data.tasks.find(t=>t.id===b.dataset.task);if(t){t.done=b.checked;save();render()}});
document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=b.dataset.day;render()});
if(document.querySelector("#prev"))document.querySelector("#prev").onclick=()=>{week--;render()};
if(document.querySelector("#next"))document.querySelector("#next").onclick=()=>{week++;render()};
if(document.querySelector("#autoplan"))document.querySelector("#autoplan").onclick=()=>{let slots=[];["Monday","Tuesday","Wednesday","Thursday","Friday"].forEach(d=>["15:00","16:30","18:00"].forEach(s=>slots.push({day:d,start:s})));let used=new Set(data.tasks.filter(t=>t.day).map(t=>t.day+t.start));let i=0;data.tasks.filter(t=>!t.done&&!t.day).forEach(t=>{while(i<slots.length&&used.has(slots[i].day+slots[i].start))i++;if(i<slots.length){Object.assign(t,slots[i]);used.add(slots[i].day+slots[i].start);i++}});save();render()};
if(document.querySelector("#export2"))document.querySelector("#export2").onclick=exportData;
if(document.querySelector("#clear"))document.querySelector("#clear").onclick=async()=>{if(confirm("Permanently delete all LIFE OS data from your cloud account?")){data=structuredClone(defaultData);saveLocal();await pushCloudData();render()}};
if(document.querySelector("#import"))document.querySelector("#import").onchange=importData;
}
function wireForm(){document.querySelector("#cancel").onclick=render;document.querySelector("#create").onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let kind=o.kind.toLowerCase()+"s";delete o.kind;o.id=uuid();if(kind==="studys")kind="tasks";if(!data[kind])return;if(kind==="tasks")o.done=false;data[kind].push(o);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="life-os-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.exams||!x.events)throw Error();data=x;normalizeIds();save();render();alert("Backup imported and queued for cloud sync.")}catch{alert("That backup file is invalid.")}};r.readAsText(f)}
document.querySelector("#export").onclick=exportData;document.querySelector("#today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
document.querySelector("#logout").onclick=async()=>{await supabase.auth.signOut();currentUser=null;showAuth("You have been signed out.")};
(async()=>{const {data:{session}}=await supabase.auth.getSession();if(session)await startSession(session);else showAuth();supabase.auth.onAuthStateChange((_event,session)=>{if(session&&!currentUser)startSession(session);else if(!session&&currentUser){currentUser=null;showAuth("You have been signed out.")}})})();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
